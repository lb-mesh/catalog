recipe: v1
metadata:
  name: portkey
  category: gateway
  description: Portkey AI gateway (LLM routing) with persisted logs and config.
  scope: system
  version: 1.0.0
resources:
  min_memory_mb: 128
  recommended_memory_mb: 512
  min_cpus: 1
container:
  image: portkeyai/gateway:latest
  ports:
  - container: 8787
    host: 8787
    protocol: tcp
  volumes:
  - /app/logs
  - /app/config
outputs:
  env:
    PORTKEY_GATEWAY_URL: http://localhost:8787
  instructions: Portkey gateway is running on http://localhost:8787.
